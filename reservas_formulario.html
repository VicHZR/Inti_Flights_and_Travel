<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta  charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Formulario de Reservas - Inti Flights and Travel</title>
    </head>
    <body>
        <!--Header-->
        <header>
            <h1>Inti Flights and Travel</h1>
            <nav>
                <ul>
                    <li><a href = "index.html">Inicio</a></li>
                    <li><a href = "#">Destinos Nacionales</a></li>
                    <li><a href = "#">Destinos Internacionales</a></li>
                    <li><a href = "reservas_formulario.html">Reservas</a></li>
                    <li><a href = "nosotros.html">Sobre Nosotros</a></li>
                    <li><a href = "#">Contacto</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <fieldset>
                <legend>Formulario de Reservas</legend>
                <section id="formulario-reservas">
                
                    <p>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name" 
                        placeholder="Ingrese su nombre" required minlength="3" maxlength="50">
                    </p>
                    <br/>
                    <p>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" autocomplete="family-name" 
                        placeholder="Ingrese su apellido" required minlength="3" maxlength="50">
                    </p>
                    <br/>
                    <p>
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" autocomplete="email" 
                        placeholder="Ingrese su correo electrónico" required minlength="5" maxlength="100">
                    </p>
                    <br/>
                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" autocomplete="tel" 
                        placeholder="Ingrese su número de teléfono" required pattern="[0-9]{10}" 
                        title="Ingrese un número de teléfono válido de 9 dígitos">
                    </p>
                    <br/>
                    <p>
                        <label for="destino">Destino:</label>
                        <select id="destino" name="destino" required>
                            <option value="">Seleccione un destino</option>
                            <option value="tokio">Tokio, Japón</option>
                            <option value="moscu">Moscú, Rusia</option>
                            <option value="machu_picchu">Machu Picchu, Perú</option>
                        </select>
                    </p>
                    <br/>
                    <p> 
                        <label for="fecha">Fecha de Viaje:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>
                    <br/>
                </section>
            </fieldset>
            <br/>
            <fieldset>
                        <legend>Datos de Facturación (Opcional)</legend>
                        <p>
                            <label for="empresa">Razón Social / Empresa:</label>
                            <input type="text" id="empresa" name="empresa" placeholder="Ej: TechCorp S.A.C." maxlength="50">
                        </p>
                            <br/>
                        <p>
                            <label for="ruc">RUC (11 dígitos):</label>
                            <input type="text" id="ruc" name="ruc" pattern="[0-9]{11}" placeholder="Ej: 20123456789" title="Debe ingresar exactamente 11 números">
                        </p>
            </fieldset>
            <br/>
            <fieldset>
                <legend>Opciones de Pago</legend>
                <section id="opciones-pago">
                    <p>
                        <label for="metodo_pago">Método de Pago:</label>
                        <select id="metodo_pago" name="metodo_pago" required>
                            <option value="">Seleccione un método de pago</option>
                            <option value="tarjeta_credito">Tarjeta de Crédito</option>
                            <option value="tarjeta_debito">Tarjeta de Débito</option>
                            <option value="paypal">PayPal</option>
                        </select>
                    </p>
                    <br/>
                    <p>
                        <label for="numero_tarjeta">Número de Tarjeta:</label>
                        <input type="text" id="numero_tarjeta" name="numero_tarjeta" 
                        placeholder="Ingrese el número de su tarjeta" required pattern="[0-9]{16}" 
                        title="Ingrese un número de tarjeta válido de 16 dígitos">
                    </p>
                    <br/>
                    <p>
                        <label for="fecha_expiracion">Fecha de Expiración:</label>
                        <input type="month" id="fecha_expiracion" name="fecha_expiracion" required>
                    </p>
                    <br/>
                    <p>
                        <label for="cvv">CVV:</label>
                        <input type="text" id="cvv" name="cvv" placeholder="Ingrese el CVV" 
                        required pattern="[0-9]{3}" title="Ingrese un CVV válido de 3 dígitos">
                    </p>
                </section>
            </fieldset>
            <br/>
            <button type="submit">Confirmar pedido</button>
        </main>

        <footer>
            <p>&copy; 2026 Inti Flights and Travel. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
